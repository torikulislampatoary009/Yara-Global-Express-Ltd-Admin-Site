<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Accounting | Yeara Global Express
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body>

<header class="admin-header">

    <div class="admin-brand">

        <div class="logo-symbol">
            Y
        </div>

        <div>

            <strong>
                YEARA
            </strong>

            <small>
                GLOBAL EXPRESS
            </small>

        </div>

    </div>


    <div class="admin-user">

        <span id="adminName">
            Admin
        </span>

        <button id="logoutButton">
            Logout
        </button>

    </div>

</header>


<nav class="admin-nav">

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="shipments.html">
        Shipments
    </a>

    <a href="quote-requests.html">
        Quote Requests
    </a>

    <a href="customers.html">
        Customers
    </a>

    <a
        href="accounting.html"
        class="active"
    >
        Accounting
    </a>

</nav>


<main class="dashboard">

    <div class="page-header">

        <div>

            <span class="page-label">
                FINANCE
            </span>

            <h1>
                Accounting
            </h1>

        </div>


        <button
            class="primary-button"
            id="addTransactionButton"
        >
            + Add Transaction
        </button>

    </div>


    <!-- ===============================
         SUMMARY
    ================================ -->

    <section class="stats-grid">

        <div class="stat-card">

            <span>
                TOTAL REVENUE
            </span>

            <strong id="totalIncome">
                $0.00
            </strong>

        </div>


        <div class="stat-card">

            <span>
                TOTAL COST
            </span>

            <strong id="totalExpense">
                $0.00
            </strong>

        </div>


        <div class="stat-card">

            <span>
                TOTAL PROFIT
            </span>

            <strong id="totalProfit">
                $0.00
            </strong>

        </div>


        <div class="stat-card">

            <span>
                TOTAL DUE
            </span>

            <strong id="totalDue">
                $0.00
            </strong>

        </div>

    </section>


    <!-- ===============================
         TRANSACTIONS
    ================================ -->

    <section class="table-card">

        <div class="table-toolbar">

            <input
                type="text"
                id="transactionSearch"
                placeholder="Search transaction..."
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Shipment
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Payment
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="transactionTableBody"
                ></tbody>

            </table>

        </div>

    </section>

</main>


<!-- ===============================
     TRANSACTION MODAL
================================ -->

<div
    class="modal-overlay"
    id="transactionModal"
>

    <div class="modal">

        <div class="modal-header">

            <div>

                <span class="page-label">
                    FINANCE
                </span>

                <h2>
                    Add Transaction
                </h2>

            </div>


            <button
                class="modal-close"
                id="closeTransactionModal"
            >
                ×
            </button>

        </div>


        <form id="transactionForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Type *
                    </label>

                    <select
                        id="transactionType"
                        required
                    >

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Category *
                    </label>

                    <select
                        id="transactionCategory"
                        required
                    >

                        <option>
                            Shipping Charge
                        </option>

                        <option>
                            Courier Cost
                        </option>

                        <option>
                            Customs
                        </option>

                        <option>
                            Packaging
                        </option>

                        <option>
                            Fuel
                        </option>

                        <option>
                            Salary
                        </option>

                        <option>
                            Office Expense
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Amount *
                    </label>

                    <input
                        type="number"
                        id="transactionAmount"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Date *
                    </label>

                    <input
                        type="date"
                        id="transactionDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Payment Status
                    </label>

                    <select
                        id="paymentStatus"
                    >

                        <option value="pending">
                            Pending
                        </option>

                        <option value="paid">
                            Paid
                        </option>

                        <option value="partial">
                            Partial
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                    >

                        <option value="">
                            Select
                        </option>

                        <option>
                            Cash
                        </option>

                        <option>
                            Bank
                        </option>

                        <option>
                            Mobile Banking
                        </option>

                        <option>
                            Card
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group full-width">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="transactionDescription"
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelTransactionButton"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Transaction
                </button>

            </div>

        </form>

    </div>

</div>


<script
    src="js/accounting.js"
></script>

</body>

</html>
