<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Yeara Global Express
    </title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body class="login-page">


    <main class="login-container">

        <div class="login-card">


            <div class="login-logo">

                <div class="logo-symbol">
                    Y
                </div>

                <div>

                    <strong>
                        YEARA
                    </strong>

                    <small>
                        GLOBAL EXPRESS
                    </small>

                </div>

            </div>


            <h1>
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Sign in to manage your courier operations.
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>


            </form>


        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
