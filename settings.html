<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Yara Global Express</title><link rel="stylesheet" href="css/admin.css">    <link rel="stylesheet" href="css/navigation.css">
</head><body>
<header class="admin-header"><div class="admin-brand"><div class="logo-symbol">Y</div><div><strong>YARA</strong><small>GLOBAL EXPRESS</small></div></div><button class="nav-toggle" id="navToggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="admin-nav" id="adminNav"><a href="dashboard.html">Dashboard</a><a href="shipments.html">Shipments</a><a href="customers.html">Customers</a><a href="quote-requests.html">Quote Requests</a><a href="accounting.html">Accounting</a><a href="reports.html">Reports</a><a href="users.html">Users</a><a href="settings.html">Settings</a><a href="pickups.html">Pickups</a><a href="branches.html">Branches</a><a href="delivery.html">Delivery Attempts</a><a href="customs.html">Customs Docs</a><a href="claims.html">Claims</a><a href="invoices.html">Invoices</a><a href="support.html">Support Tickets</a></nav><div class="admin-user"><span id="adminName">Admin</span><button id="logoutButton">Logout</button></div></header>
<main class="dashboard"><div class="page-header"><div><span class="page-label">SYSTEM</span><h1>Settings</h1></div></div>
<div class="content-grid"><section class="table-card settings-card"><div class="section-card-header"><h2>Company Settings</h2></div><form id="settingsForm" class="settings-form"><div class="form-grid"><div class="form-group"><label>Company Name</label><input id="company_name" name="company_name"></div><div class="form-group"><label>Default Currency</label><select id="default_currency"><option>USD</option><option>BDT</option><option>EUR</option><option>GBP</option></select></div><div class="form-group"><label>Support Email</label><input id="support_email" type="email"></div><div class="form-group"><label>Support Phone</label><input id="support_phone"></div></div><button class="primary-button">Save Settings</button><span id="settingsMessage"></span></form></section>
<section class="table-card settings-card"><div class="section-card-header"><h2>Change Password</h2></div><form id="passwordForm" class="settings-form"><div class="form-group"><label>Current Password</label><input id="currentPassword" type="password" required></div><div class="form-group"><label>New Password</label><input id="newPassword" type="password" minlength="8" required></div><button class="primary-button">Change Password</button></form></section></div></main>
<script src="js/core.js"></script><script src="js/nav.js"></script><script src="js/settings.js"></script></body></html>
