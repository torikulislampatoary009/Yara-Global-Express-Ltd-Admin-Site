<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | Yara Global Express</title><link rel="stylesheet" href="css/admin.css"></head><body>
<header class="admin-header"><div class="admin-brand"><div class="logo-symbol">Y</div><div><strong>YARA</strong><small>GLOBAL EXPRESS</small></div></div><nav class="admin-nav"><a href="dashboard.html">Dashboard</a><a href="shipments.html">Shipments</a><a href="customers.html">Customers</a><a href="quote-requests.html">Quote Requests</a><a href="accounting.html">Accounting</a><a href="reports.html">Reports</a><a href="users.html">Users</a><a href="settings.html">Settings</a></nav><div class="admin-user"><span id="adminName">Admin</span><button id="logoutButton">Logout</button></div></header>
<main class="dashboard"><div class="page-header"><div><span class="page-label">ACCESS CONTROL</span><h1>Users & Staff</h1></div><button class="primary-button" id="addUserButton">+ Add User</button></div>
<section class="table-card"><div class="table-toolbar"><input id="userSearch" placeholder="Search users..."></div><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Action</th></tr></thead><tbody id="userTableBody"></tbody></table></div></section></main>
<div class="modal-overlay" id="userModal"><div class="modal"><div class="modal-header"><div><span class="page-label">ACCESS</span><h2 id="userModalTitle">Add User</h2></div><button class="modal-close" id="closeUserModal">×</button></div>
<form id="userForm"><div class="form-grid"><div class="form-group"><label>Name *</label><input id="userName" required></div><div class="form-group"><label>Email *</label><input type="email" id="userEmail" required></div><div class="form-group"><label>Password <span id="passwordHint">*</span></label><input type="password" id="userPassword" minlength="8"></div><div class="form-group"><label>Role</label><select id="userRole"><option value="staff">Staff</option><option value="admin">Admin</option></select></div><div class="form-group"><label>Status</label><select id="userStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div><div class="modal-actions"><button type="button" class="secondary-button" id="cancelUser">Cancel</button><button class="primary-button">Save User</button></div></form></div></div>
<script src="js/core.js"></script><script src="js/users.js"></script></body></html>
